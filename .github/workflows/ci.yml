name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64-release
            name: normal
          - preset: x64-release-dist
            name: distribution
          - preset: x64-release-jbm
            name: evs-jbm

    name: ${{ matrix.name }} (${{ matrix.preset }})

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build/${{ matrix.preset }} --parallel

      - name: Test
        run: |
          ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python tests/DescribeCodecCrash.py "out/build/${{ matrix.preset }}/TelephonyCodecControls.map" "out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log"
          }
          exit $testExit

  linux-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            options: ""
          - name: distribution
            options: "-DTELEPHONY_DISTRIBUTION_BUILD=ON"
          - name: evs-jbm
            options: "-DTELEPHONY_USE_EVS_JBM=ON"
    name: Linux headless (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B out/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DTELEPHONY_BUILD_PLUGIN=OFF ${{ matrix.options }}
      - name: Build
        run: cmake --build out/build/ci --parallel 2
      - name: Test
        run: ctest --test-dir out/build/ci --output-on-failure
